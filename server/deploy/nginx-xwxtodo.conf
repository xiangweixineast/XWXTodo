server {
    listen 443 ssl;
    server_name xwxai.cn;

    ssl_certificate /etc/nginx/xwxai.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/xwxai.cn.key;

    location = /xwxtodo/api/v1 {
        return 308 /xwxtodo/api/v1/;
    }

    # API 前缀会被剥离后转发给 FastAPI，例如 /xwxtodo/api/v1/health -> /health。
    location /xwxtodo/api/v1/ {
        proxy_pass http://127.0.0.1:18080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        return 404;
    }
}
